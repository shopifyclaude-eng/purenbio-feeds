name: Build Meta feeds
on:
  schedule:
    - cron: "0 * * * *"      # every hour, UTC
  workflow_dispatch:         # manual run button
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate feeds
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          ENABLE_SA: ${{ vars.ENABLE_SA }}       # set repo variable ENABLE_SA=1 when KSA warehouse is live
        run: python feed.py
      - name: Commit feeds
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/*.csv
          git diff --cached --quiet || git commit -m "feeds $(date -u +%FT%TZ)"
          git push
